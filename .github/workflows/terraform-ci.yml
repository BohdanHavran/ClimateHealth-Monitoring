name: Infrastructure source review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check infrastructure/terraform sources and costs (no Terraform execution)
        run: python scripts/check_infrastructure_sources.py
# Plans, state and manual applies belong exclusively to HCP Terraform.
# Both HCP workspaces use working directory infrastructure/terraform.
