name: Terraform static validation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: infrastructure/terraform
jobs:
  validate:
    if: ${{ false }} # Phase 2: all Terraform execution is deferred.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize without state or credentials
        run: terraform init -backend=false -input=false
      - name: Validate schema
        run: terraform validate -no-color
      - name: Infrastructure security scan
        run: |
          python -m pip install 'checkov==3.2.498'
          checkov --directory . --framework terraform --quiet --compact
